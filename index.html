<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>المنصة التفاعلية لتوثيق البحوث والتقارير المدرسية</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Babel -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Cairo Font -->
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Cairo', sans-serif; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const SUBJECTS = ["الجميع", "اللغة العربية", "الدراسات الاجتماعية", "التربية الإسلامية", "العلوم العامة", "المهارات الحياتية"];
    const ENTRY_TYPES = ["بحث متكامل", "تقرير استقصائي موجز", "عينة / نشاط بحثي مصغر"];
    const PILLARS = [
      "المواطنة والهوية والتراث والثقافة الوطنية",
      "التعليم والتعلّم والبحث العلمي والقدرات الوطنية",
      "الرفاه والحماية الاجتماعية",
      "البيئة والموارد الطبيعية المستدامة",
      "التحول الرقمي والاقتصاد المعرفي"
    ];
    const STATUSES = ["مقترح بحثي", "قيد التنفيذ وجمع المصادر", "تحليل وتدوين النتائج", "مكتمل وجاهز للتقييم", "مرشح للمسابقات والمعارض"];

    const AI_RESEARCH_TOOLS = [
      { name: "Consensus", desc: "محرك بحث ذكاء اصطناعي يستخرج الأدلة من الأوراق العلمية المحكمة", url: "https://consensus.app" },
      { name: "Semantic Scholar", desc: "محرك بحث أكاديمي ذكي من معهد ألين للذكاء الاصطناعي", url: "https://www.semanticscholar.org" },
      { name: "Elicit", desc: "أداة ذكاء اصطناعي لأتمتة مراجعة الدراسات واستخراج النتائج", url: "https://elicit.com" },
      { name: "Google Scholar", desc: "الباحث العلمي المعتمد من جوجل للكتب والأبحاث الأكاديمية", url: "https://scholar.google.com" }
    ];

    function App() {
      const [projects, setProjects] = useState(() => {
        const saved = localStorage.getItem("om_school_research_db_v2");
        return saved ? JSON.parse(saved) : [];
      });

      const [selectedSubject, setSelectedSubject] = useState("الجميع");
      const [selectedType, setSelectedType] = useState("الجميع");
      const [searchQuery, setSearchQuery] = useState("");
      const [isModalOpen, setIsModalOpen] = useState(false);
      const [editingProject, setEditingProject] = useState(null);

      const [formData, setFormData] = useState({
        title: "",
        studentName: "",
        supervisor: "",
        subject: "اللغة العربية",
        entryType: "بحث متكامل",
        grade: "الصف الخامس",
        visionPillar: PILLARS[0],
        status: "مقترح بحثي",
        skills: "",
        projectUrl: "",
        fileName: "",
        fileData: "",
        notes: ""
      });

      useEffect(() => {
        localStorage.setItem("om_school_research_db_v2", JSON.stringify(projects));
      }, [projects]);

      const handleFileUpload = (e) => {
        const file = e.target.files[0];
        if (file) {
          if (file.size > 2 * 1024 * 1024) {
            alert("يرجى اختيار ملف حجمه أقل من 2 ميجابايت لتفادي امتلاء ذاكرة المتصفح، أو استخدم رابط Google Drive أدناه.");
            return;
          }
          const reader = new FileReader();
          reader.onload = () => {
            setFormData(prev => ({ ...prev, fileName: file.name, fileData: reader.result }));
          };
          reader.readAsDataURL(file);
        }
      };

      const handleOpenModal = (project = null) => {
        if (project) {
          setEditingProject(project);
          setFormData(project);
        } else {
          setEditingProject(null);
          setFormData({
            title: "",
            studentName: "",
            supervisor: "",
            subject: "اللغة العربية",
            entryType: "بحث متكامل",
            grade: "الصف الخامس",
            visionPillar: PILLARS[0],
            status: "مقترح بحثي",
            skills: "",
            projectUrl: "",
            fileName: "",
            fileData: "",
            notes: ""
          });
        }
        setIsModalOpen(true);
      };

      const handleSave = (e) => {
        e.preventDefault();
        if (editingProject) {
          setProjects(projects.map(p => p.id === editingProject.id ? { ...formData, id: p.id, date: new Date().toLocaleDateString('ar-OM') } : p));
        } else {
          setProjects([...projects, { ...formData, id: Date.now(), date: new Date().toLocaleDateString('ar-OM') }]);
        }
        setIsModalOpen(false);
      };

      const handleDelete = (id) => {
        if (confirm("هل تريد حذف هذا السجل نهائياً؟")) {
          setProjects(projects.filter(p => p.id !== id));
        }
      };

      const exportCSV = () => {
        if (projects.length === 0) return alert("لا توجد سجلات حالياً لتصديرها.");
        const headers = ["العنوان", "النوع", "الطالب/الفريق", "المادة", "الصف", "المشرف", "المحور الوطني 2040", "الحالة", "المهارات", "رابط المشروع"];
        const rows = projects.map(p => [
          `"${p.title}"`, `"${p.entryType}"`, `"${p.studentName}"`, `"${p.subject}"`, `"${p.grade}"`, `"${p.supervisor}"`, `"${p.visionPillar}"`, `"${p.status}"`, `"${p.skills}"`, `"${p.projectUrl || ''}"`
        ]);
        const csvContent = "\uFEFF" + [headers.join(","), ...rows.map(r => r.join(","))].join("\n");
        const blob = new Blob([csvContent], { type: "text/csv;charset=utf-8;" });
        const link = document.createElement("a");
        link.href = URL.createObjectURL(blob);
        link.download = "سجل_البحوث_المدرسية.csv";
        link.click();
      };

      const filtered = projects.filter(p => {
        const matchesSubj = selectedSubject === "الجميع" || p.subject === selectedSubject;
        const matchesType = selectedType === "الجميع" || p.entryType === selectedType;
        const matchesQuery = p.title.toLowerCase().includes(searchQuery.toLowerCase()) ||
                             p.studentName.toLowerCase().includes(searchQuery.toLowerCase()) ||
                             p.supervisor.toLowerCase().includes(searchQuery.toLowerCase());
        return matchesSubj && matchesType && matchesQuery;
      });

      return (
        <div className="min-h-screen flex flex-col">
          {/* Header */}
          <header className="bg-emerald-900 text-white shadow-lg border-b border-emerald-800">
            <div className="max-w-7xl mx-auto px-4 py-5 flex flex-wrap justify-between items-center gap-4">
              <div>
                <div className="flex items-center gap-2 mb-1">
                  <span className="text-[11px] bg-amber-400 text-slate-900 px-2.5 py-0.5 rounded-full font-bold">رؤية عُمان 2040</span>
                  <span className="text-[11px] bg-emerald-800 text-emerald-200 px-2.5 py-0.5 rounded-full">منصة مدرسية تفاعلية</span>
                </div>
                <h1 className="text-2xl font-bold">سجل البحوث والتقارير المدرسية التفاعلي</h1>
                <p className="text-xs text-emerald-200">توثيق الأبحاث، التقارير الموجزة، ونماذج الأنشطة الاستقصائية لجميع التخصصات</p>
              </div>
              <div className="flex items-center gap-2">
                <button onClick={exportCSV} className="bg-emerald-800 hover:bg-emerald-700 text-white text-xs font-bold px-4 py-2.5 rounded-xl border border-emerald-700 transition">
                  تصدير تقرير Excel
                </button>
                <button onClick={() => handleOpenModal()} className="bg-amber-400 hover:bg-amber-300 text-slate-950 text-xs font-bold px-4 py-2.5 rounded-xl shadow transition">
                  + إضافة بحث / تقرير جديد
                </button>
              </div>
            </div>
          </header>

          {/* Trusted AI Tools Strip */}
          <section className="bg-emerald-950 text-white py-3 px-4 border-b border-emerald-900">
            <div className="max-w-7xl mx-auto flex flex-wrap items-center justify-between gap-3 text-xs">
              <span className="font-bold flex items-center gap-1.5 text-amber-300">
                <span>🤖</span> محركات وأدوات البحث العلمي بالذكاء الاصطناعي (موثوقة):
              </span>
              <div className="flex flex-wrap items-center gap-2">
                {AI_RESEARCH_TOOLS.map(tool => (
                  <a
                    key={tool.name}
                    href={tool.url}
                    target="_blank"
                    rel="noopener noreferrer"
                    title={tool.desc}
                    className="bg-emerald-900/80 hover:bg-emerald-800 text-slate-200 hover:text-white px-3 py-1 rounded-lg border border-emerald-700/60 transition flex items-center gap-1 text-[11px]"
                  >
                    <span>{tool.name}</span>
                    <span className="text-[9px] text-amber-300">↗</span>
                  </a>
                ))}
              </div>
            </div>
          </section>

          {/* Main Content */}
          <main className="max-w-7xl mx-auto px-4 py-6 flex-1 w-full space-y-6">
            {/* Filter Bar */}
            <div className="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 space-y-3">
              <div className="flex flex-wrap items-center justify-between gap-3">
                <div className="flex flex-wrap items-center gap-1.5">
                  <span className="text-xs font-bold text-slate-500 ml-1">المادة:</span>
                  {SUBJECTS.map(subj => (
                    <button
                      key={subj}
                      onClick={() => setSelectedSubject(subj)}
                      className={`text-xs px-3 py-1.5 rounded-lg font-bold transition ${selectedSubject === subj ? 'bg-emerald-800 text-white' : 'bg-slate-100 hover:bg-slate-200 text-slate-600'}`}
                    >
                      {subj}
                    </button>
                  ))}
                </div>
                <input
                  type="text"
                  placeholder="بحث بالعنوان، الطالب، أو المشرف..."
                  value={searchQuery}
                  onChange={e => setSearchQuery(e.target.value)}
                  className="w-full md:w-72 text-xs border border-slate-300 rounded-xl px-3 py-2 outline-none focus:ring-2 focus:ring-emerald-600"
                />
              </div>

              <div className="flex flex-wrap items-center gap-1.5 pt-2 border-t border-slate-100">
                <span className="text-xs font-bold text-slate-500 ml-1">نوع المشاركة:</span>
                {["الجميع", ...ENTRY_TYPES].map(type => (
                  <button
                    key={type}
                    onClick={() => setSelectedType(type)}
                    className={`text-xs px-2.5 py-1 rounded-md transition ${selectedType === type ? 'bg-amber-400 text-slate-900 font-bold' : 'bg-slate-100 hover:bg-slate-200 text-slate-600'}`}
                  >
                    {type}
                  </button>
                ))}
              </div>
            </div>

            {/* Research Cards */}
            {filtered.length === 0 ? (
              <div className="bg-white border-2 border-dashed border-slate-300 rounded-2xl p-12 text-center text-slate-500">
                <p className="font-bold text-base">لا توجد أعمال بحثية أو تقارير مسجلة</p>
                <p className="text-xs mt-1">اضغط على زر الإضافة لتسجيل أول مساهمة بحثية.</p>
              </div>
            ) : (
              <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
                {filtered.map(p => (
                  <div key={p.id} className="bg-white rounded-2xl border border-slate-200 p-5 shadow-sm hover:shadow-md transition flex flex-col justify-between">
                    <div>
                      <div className="flex items-center justify-between gap-2 mb-2">
                        <span className="text-[11px] font-bold px-2 py-0.5 rounded bg-emerald-50 text-emerald-800 border border-emerald-200">{p.subject}</span>
                        <span className="text-[10px] bg-amber-50 text-amber-900 border border-amber-200 px-2 py-0.5 rounded font-semibold">{p.entryType}</span>
                      </div>

                      <h3 className="font-bold text-base text-slate-900 mb-2 leading-snug">{p.title}</h3>
                      <p className="text-xs text-slate-600 mb-1"><strong className="text-slate-800">الطالب / الفريق:</strong> {p.studentName} ({p.grade})</p>
                      <p className="text-xs text-slate-600 mb-3"><strong className="text-slate-800">المشرف:</strong> {p.supervisor}</p>

                      <div className="bg-slate-50 p-3 rounded-xl border border-slate-100 text-[11px] space-y-1.5 mb-3">
                        <p className="text-emerald-900 font-bold truncate">🎯 {p.visionPillar}</p>
                        <p className="text-slate-600">📌 الحالة: <span className="font-bold text-slate-800">{p.status}</span></p>
                        {p.skills && <p className="text-slate-500 truncate">💡 المهارات: {p.skills}</p>}
                      </div>

                      {/* Attachments & Links */}
                      {(p.fileName || p.projectUrl) && (
                        <div className="flex flex-wrap gap-2 text-[11px] mb-3">
                          {p.fileName && (
                            <a href={p.fileData} download={p.fileName} className="bg-slate-100 hover:bg-slate-200 text-slate-700 px-2.5 py-1 rounded-md flex items-center gap-1 border border-slate-200">
                              <span>📄 تحميل:</span> <span className="font-bold truncate max-w-[120px]">{p.fileName}</span>
                            </a>
                          )}
                          {p.projectUrl && (
                            <a href={p.projectUrl} target="_blank" rel="noopener noreferrer" className="bg-blue-50 hover:bg-blue-100 text-blue-700 px-2.5 py-1 rounded-md flex items-center gap-1 border border-blue-200">
                              <span>🔗 رابط الملف السحابي</span>
                            </a>
                          )}
                        </div>
                      )}
                    </div>

                    <div className="flex items-center justify-between pt-3 border-t border-slate-100 text-xs">
                      <span className="text-[10px] text-slate-400">{p.date}</span>
                      <div className="flex gap-2">
                        <button onClick={() => handleOpenModal(p)} className="text-emerald-700 hover:text-emerald-900 font-bold">تعديل</button>
                        <button onClick={() => handleDelete(p.id)} className="text-rose-600 hover:text-rose-800 font-bold">حذف</button>
                      </div>
                    </div>
                  </div>
                ))}
              </div>
            )}
          </main>

          {/* Modal */}
          {isModalOpen && (
            <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4 z-50">
              <div className="bg-white rounded-2xl w-full max-w-xl max-h-[92vh] overflow-y-auto p-6 shadow-2xl">
                <h2 className="text-lg font-bold text-slate-900 mb-4">{editingProject ? "تعديل العمل البحثي" : "تسجيل مشاركة بحثية جديدة"}</h2>
                <form onSubmit={handleSave} className="space-y-3.5 text-xs">
                  <div>
                    <label className="block font-bold text-slate-700 mb-1">عنوان البحث أو التقرير *</label>
                    <input required type="text" value={formData.title} onChange={e => setFormData({...formData, title: e.target.value})} className="w-full border border-slate-300 rounded-lg p-2 focus:ring-2 focus:ring-emerald-600 outline-none" placeholder="مثال: استدامة نظام الأفلاج في سلطنة عمان..." />
                  </div>

                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="block font-bold text-slate-700 mb-1">نوع المشاركة *</label>
                      <select value={formData.entryType} onChange={e => setFormData({...formData, entryType: e.target.value})} className="w-full border border-slate-300 rounded-lg p-2 focus:ring-2 focus:ring-emerald-600 outline-none">
                        {ENTRY_TYPES.map(t => <option key={t} value={t}>{t}</option>)}
                      </select>
                    </div>
                    <div>
                      <label className="block font-bold text-slate-700 mb-1">المادة الدراسية *</label>
                      <select value={formData.subject} onChange={e => setFormData({...formData, subject: e.target.value})} className="w-full border border-slate-300 rounded-lg p-2 focus:ring-2 focus:ring-emerald-600 outline-none">
                        {SUBJECTS.filter(s => s !== "الجميع").map(s => <option key={s} value={s}>{s}</option>)}
                      </select>
                    </div>
                  </div>

                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="block font-bold text-slate-700 mb-1">اسم الطالب أو الفريق *</label>
                      <input required type="text" value={formData.studentName} onChange={e => setFormData({...formData, studentName: e.target.value})} className="w-full border border-slate-300 rounded-lg p-2 focus:ring-2 focus:ring-emerald-600 outline-none" />
                    </div>
                    <div>
                      <label className="block font-bold text-slate-700 mb-1">المعلم المشرف *</label>
                      <input required type="text" value={formData.supervisor} onChange={e => setFormData({...formData, supervisor: e.target.value})} placeholder="اكتب اسم المعلم/ـة..." className="w-full border border-slate-300 rounded-lg p-2 focus:ring-2 focus:ring-emerald-600 outline-none" />
                    </div>
                  </div>

                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="block font-bold text-slate-700 mb-1">الصف الدراسي</label>
                      <input type="text" value={formData.grade} onChange={e => setFormData({...formData, grade: e.target.value})} className="w-full border border-slate-300 rounded-lg p-2 focus:ring-2 focus:ring-emerald-600 outline-none" />
                    </div>
                    <div>
                      <label className="block font-bold text-slate-700 mb-1">حالة التقدم</label>
                      <select value={formData.status} onChange={e => setFormData({...formData, status: e.target.value})} className="w-full border border-slate-300 rounded-lg p-2 focus:ring-2 focus:ring-emerald-600 outline-none">
                        {STATUSES.map(s => <option key={s} value={s}>{s}</option>)}
                      </select>
                    </div>
                  </div>

                  <div>
                    <label className="block font-bold text-slate-700 mb-1">الربط بمحور رؤية عُمان 2040</label>
                    <select value={formData.visionPillar} onChange={e => setFormData({...formData, visionPillar: e.target.value})} className="w-full border border-slate-300 rounded-lg p-2 focus:ring-2 focus:ring-emerald-600 outline-none">
                      {PILLARS.map(p => <option key={p} value={p}>{p}</option>)}
                    </select>
                  </div>

                  <div>
                    <label className="block font-bold text-slate-700 mb-1">المهارات المكتسبة</label>
                    <input type="text" value={formData.skills} onChange={e => setFormData({...formData, skills: e.target.value})} placeholder="مثال: تحليل نصوص، المقابلات التراثية، مهارات العرض..." className="w-full border border-slate-300 rounded-lg p-2 focus:ring-2 focus:ring-emerald-600 outline-none" />
                  </div>

                  {/* Attachment & Cloud Link */}
                  <div className="bg-slate-50 p-3 rounded-xl border border-slate-200 space-y-2">
                    <label className="block font-bold text-slate-800">إرفاق عينة البحث أو التقرير</label>
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-2">
                      <div>
                        <span className="text-[10px] text-slate-500 block mb-1">1. رفع ملف مباشر (PDF/Word &lt; 2MB):</span>
                        <input type="file" onChange={handleFileUpload} className="w-full text-[11px] text-slate-600 file:mr-2 file:py-1 file:px-2 file:rounded file:border-0 file:bg-emerald-800 file:text-white file:text-xs" />
                        {formData.fileName && <span className="text-[10px] text-emerald-700 font-bold mt-1 block">الملف الحالي: {formData.fileName}</span>}
                      </div>
                      <div>
                        <span className="text-[10px] text-slate-500 block mb-1">2. أو رابط سحابي (Google Drive / OneDrive):</span>
                        <input type="url" value={formData.projectUrl} onChange={e => setFormData({...formData, projectUrl: e.target.value})} placeholder="https://drive.google.com/..." className="w-full border border-slate-300 rounded-lg p-1.5 focus:ring-2 focus:ring-emerald-600 outline-none text-[11px]" />
                      </div>
                    </div>
                  </div>

                  <div className="flex justify-end gap-2 pt-3 border-t">
                    <button type="button" onClick={() => setIsModalOpen(false)} className="px-4 py-2 border rounded-lg hover:bg-slate-100 font-bold">إلغاء</button>
                    <button type="submit" className="px-5 py-2 bg-emerald-800 text-white rounded-lg hover:bg-emerald-700 font-bold">حفظ السجل</button>
                  </div>
                </form>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
